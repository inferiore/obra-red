services:
  backend:
    image: ghcr.io/inferiore/obra-red-backend:latest
    restart: unless-stopped
    env_file:
      - ./server/.env.production
    environment:
      PORT: 3001
      DB_PATH: /app/data/obrared.sqlite
    volumes:
      - sqlite-data:/app/data
    expose:
      - "3001"

  frontend:
    image: ghcr.io/inferiore/obra-red-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  sqlite-data:
