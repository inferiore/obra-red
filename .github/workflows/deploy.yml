name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-backend:
    name: Backend — type-check & e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run test:e2e

  test-frontend:
    name: Frontend — type-check, lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      # Hay errores preexistentes en el boilerplate de shadcn (ver CLAUDE.md) —
      # se reporta pero no bloquea el pipeline hasta que se limpien aparte.
      - run: npm run lint
        continue-on-error: true
      - run: npm run test -- --run

  deploy:
    name: Deploy a producción
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    # Disparo manual únicamente (Actions → CI/CD → Run workflow) hasta que el
    # servidor y los secrets estén configurados. Para deployar automáticamente
    # en cada push a main, cambiá esta condición a:
    #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Deploy por SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" "cd $DEPLOY_PATH && git pull origin main && docker compose up -d --build"
