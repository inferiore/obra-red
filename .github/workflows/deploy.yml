name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/obra-red-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/obra-red-frontend

jobs:
  test-backend:
    name: Backend — type-check & e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run test:e2e

  test-frontend:
    name: Frontend — type-check, lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      # Hay errores preexistentes en el boilerplate de shadcn (ver CLAUDE.md) —
      # se reporta pero no bloquea el pipeline hasta que se limpien aparte.
      - run: npm run lint
        continue-on-error: true
      - run: npm run test -- --run

  # El build (compilar TypeScript, instalar deps, compilar sqlite3 nativo)
  # corre acá, en un runner con 7GB de RAM — no en el servidor de producción,
  # que es una instancia chica y se quedaba sin memoria intentando compilar
  # todo eso localmente.
  build-and-push:
    name: Build & push imágenes
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy a producción
    runs-on: ubuntu-latest
    needs: [build-and-push]
    # Disparo manual únicamente (Actions → CI/CD → Run workflow) hasta que
    # confirmemos que el flujo completo funciona bien. Para deployar
    # automáticamente en cada push a main, cambiá esta condición a:
    #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Deploy por SSH
        env:
          SSH_KEY: ${{ secrets.GCP_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # El servidor solo baja las imágenes ya compiladas, nunca las arma.
          # Para que "docker compose pull" funcione, las imágenes en GHCR
          # deben estar en público (Packages → paquete → Change visibility)
          # la primera vez, o el servidor necesita su propio docker login.
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" "cd $DEPLOY_PATH && git pull origin main && docker compose pull && docker compose up -d"
